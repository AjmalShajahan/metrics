name: Publish custom container images

on:
  workflow_dispatch:
  push:
    branches: [custom, custom-test]

permissions: {}

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ github.ref_name }} image
    if: github.repository == 'AjmalShajahan/metrics'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ajmalshajahan/metrics
      SOURCE_IMAGE: ghcr.io/ajmalshajahan/metrics:sha-${{ github.sha }}
      TARGET_IMAGE: ghcr.io/ajmalshajahan/metrics:custom
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Check for pre-built tested image
        id: check-image
        if: github.ref_name == 'custom'
        run: |
          if docker buildx imagetools inspect "$SOURCE_IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found pre-built tested image: $SOURCE_IMAGE"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pre-built tested image found for $SOURCE_IMAGE, falling back to build"
          fi

      - name: Promote tested image
        if: github.ref_name == 'custom' && steps.check-image.outputs.found == 'true'
        run: |
          docker buildx imagetools create --tag "$TARGET_IMAGE" "$SOURCE_IMAGE"
          SOURCE_DIGEST=$(docker buildx imagetools inspect "$SOURCE_IMAGE" --format '{{json .Manifest.Digest}}')
          TARGET_DIGEST=$(docker buildx imagetools inspect "$TARGET_IMAGE" --format '{{json .Manifest.Digest}}')
          test "$SOURCE_DIGEST" = "$TARGET_DIGEST"
          echo "Promoted $SOURCE_IMAGE to $TARGET_IMAGE (digest: $TARGET_DIGEST)"

      - name: Checkout repository
        if: github.ref_name == 'custom-test' || steps.check-image.outputs.found != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Build and publish image
        if: github.ref_name == 'custom-test' || steps.check-image.outputs.found != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=metrics-custom-image
          cache-to: type=gha,mode=max,scope=metrics-custom-image
